name: Publish image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: openshift-oracle-capi-autoscaling
  CAPOCI_VERSION: v0.24.0

jobs:
  publish:
    name: Build and push latest image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest image
        shell: bash
        run: |
          set -euo pipefail

          image="${IMAGE_REGISTRY}/${IMAGE_OWNER,,}/${IMAGE_NAME}"

          docker buildx build \
            --push \
            --platform=linux/amd64,linux/arm64 \
            --tag "${image}:latest" \
            --build-arg CAPOCI_VERSION="${CAPOCI_VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=OCI OpenShift autoscaling operator" \
            .
