apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: oci-capi-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: oci-capi-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: oci-capi-operator
    spec:
      initContainers:
      - name: crdgen
        command:
          - /manager
        args:
          - init
        image: controller:latest
        envFrom:
        - configMapRef:
            name: oci-capi-operator-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - /manager
        args:
          - run
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1000Mi
          requests:
            cpu: 10m
            memory: 128Mi
        env:
        - name: OCI_CREDENTIALS_FINGERPRINT
          valueFrom:
            secretKeyRef:
              name: oci-capi-operator-capoci-auth-credentials
              key: fingerprint
              optional: true
        - name: OCI_CREDENTIALS_KEY
          valueFrom:
            secretKeyRef:
              name: oci-capi-operator-capoci-auth-credentials
              key: privateKey
              optional: true
        - name: OCI_CREDENTIALS_PASSPHRASE
          valueFrom:
            secretKeyRef:
              name: oci-capi-operator-capoci-auth-credentials
              key: passphrase
              optional: true
        envFrom:
        - configMapRef:
            name: oci-capi-operator-config
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
